<style>
/* ============================================================
   DESIGN SYSTEM
   Palette: amber phosphor on graphite — the colourway of early
   financial data terminals. Grounded in the subject (trading,
   analytics, instrumentation) rather than a default dark theme.
   Accent is deliberately scarce: hairlines, indices, one CTA.
   FortaFlow violet (--ff) is scoped to that case study only,
   because it is the product's identity, not this site's.
   ============================================================ */
:root{
  /* surfaces */
  /* Two surfaces, not three. There used to be a --raised:#1A1E21 here (and a
     white one in the light palette) sitting one step above --surface. It was
     declared in all three palettes and consumed by exactly zero rules — nothing
     on the site ever painted it. Because several contrast decisions below were
     taken against it as the "worst case", the figures they quote are more
     conservative than the two real surfaces require, which is harmless and has
     been left alone. Deleted rather than assigned to a card, because picking an
     element to elevate at this stage would be a visual change dressed up as a
     cleanup. */
  --base:#0E1011;
  --surface:#14171A;
  --line:#252A2E;
  --line-soft:#1C2023;
  --line-strong:#333A3E;
  /* Interactive-control borders. WCAG 1.4.11 wants 3:1 for the boundary of any
     control you need to see to identify it; --line-soft was 1.16:1 and
     --line-strong 1.65:1, so the theme toggle, the burger, the project cards and
     both conversion buttons had no perceptible edge. This clears 3:1 on both
     surfaces (3.96 base / 3.73 surface).
     Deliberately NOT applied to chips, .arch-b pills or .tl-when date pills:
     those are static labels, not controls, so 1.4.11 does not reach them and
     putting a 3:1 edge on 216 chips would shout. */
  --line-ctl:#66747C;

  /* type colours
     Four tiers, and each one has to earn its place. The rule: every tier must
     clear 4.5:1 against the *worst* surface it can land on, not just --base.
     The old --muted/--faint pair failed that (4.68 and 4.03) and they were only
     4% apart in lightness, so they read as one colour that happened to be
     slightly broken. Both were lifted and separated: muted is ~6:1 and faint
     ~5:1 on every surface in both themes. */
  --text:#EDEAE4;    /* 15.9 : 1 on base */
  --text-2:#B4B7B3;  /*  9.4 : 1 */
  --muted:#969B9D;   /*  6.8 : 1 base · 6.4 : 1 on surface */
  --faint:#8A8F92;   /*  5.8 : 1 base · 5.5 : 1 on surface */

  /* accent */
  --accent:#E5A244;
  --accent-hi:#F0B865;
  --accent-wash:rgba(229,162,68,.12);
  --accent-line:rgba(229,162,68,.34);

  /* Scoped product colour — FortaFlow brand. --ff is 4.39:1 on --base, which
     clears the 3:1 large-text and non-text thresholds but NOT 4.5:1 for body
     copy. It is used only on the 35px+ FortaFlow display type and on borders,
     which is why that is fine. For any small text, use --ff-hi (7.3:1). */
  --ff:#7C5CFF;
  --ff-hi:#A184FF;
  --ff-wash:rgba(124,92,255,.13);

  /* type */
  --sans:'Instrument Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --fs-display:clamp(2.55rem,6.2vw,5.15rem);
  --fs-h1:clamp(2rem,4.2vw,3.15rem);
  --fs-h2:clamp(1.45rem,2.5vw,1.95rem);
  --fs-h3:clamp(1.05rem,1.5vw,1.2rem);
  --fs-lede:clamp(1.02rem,1.5vw,1.19rem);
  --fs-body:1rem;
  --fs-sm:.875rem;
  --fs-xs:.8125rem;
  --fs-label:.6875rem;

  /* layout */
  --pad:clamp(20px,5vw,56px);
  /* Header height. The mobile sheet is offset by exactly this much, so the two
     must never drift apart — it was 64px hardcoded in both .topbar-in and
     .sheet, which is how a gap showing page content behind the sheet gets
     introduced by an unrelated header tweak. */
  --topbar-h:64px;
  --rail:158px;
  --gutter:clamp(24px,3vw,40px);
  --maxw:1200px;
  --measure:68ch;

  --r:4px;
  --r-lg:8px;

  --t-fast:120ms cubic-bezier(.4,0,.2,1);
  --t-mid:200ms cubic-bezier(.4,0,.2,1);
}

html[data-theme="light"]{
  --base:#FAFAF8;
  --surface:#F2F2EF;
  --line:#DCDCD6;
  --line-soft:#E6E6E1;
  --line-strong:#C4C4BD;
  --line-ctl:#898984;   /* 3.36 base / 3.13 surface / 3.51 raised */
  --text:#16181A;
  --text-2:#3E4245;
  --muted:#55595C;
  --faint:#63686B;
  --accent:#96601A;
  --accent-hi:#7C4E12;
  --accent-wash:rgba(150,96,26,.09);
  --accent-line:rgba(150,96,26,.3);
  --ff:#5B3FD6;
  --ff-hi:#4A31BE;
  --ff-wash:rgba(91,63,214,.09);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--base);
  color:var(--text);
  font-family:var(--sans);
  font-size:var(--fs-body);
  line-height:1.6;
  font-feature-settings:"kern" 1,"liga" 1;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
img,svg{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4,p,ul,ol,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
::selection{background:var(--accent);color:#0E1011}
/* Light --accent is #96601A; #0E1011 on it is 3.62:1, under the 4.5 needed at
   these sizes. White is 5.27:1. Same bug .btn-p already had fixed; .skip and
   ::selection were missed, and .skip is the first focusable thing on the page. */
html[data-theme="light"] ::selection{color:#fff}
html[data-theme="light"] .skip{color:#fff}
html[data-theme="light"] ::selection{background:var(--accent);color:#fff}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
:focus:not(:focus-visible){outline:none}

.skip{position:absolute;left:-9999px;top:0;z-index:200;padding:12px 18px;background:var(--accent);color:#0E1011;font-weight:600;font-size:var(--fs-sm)}
.skip:focus{left:12px;top:12px}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- layout ---------- */
.shell{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
.grid{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start}
.rail{position:relative;padding-top:2px}
.rail-sticky{position:sticky;top:104px}
/* the spine: a continuous hairline running the length of the page */
.col{border-left:1px solid var(--line-soft);padding-left:var(--gutter);min-width:0}
.sect{padding-block:clamp(52px,7vw,92px)}
.sect-tight{padding-block:clamp(34px,4.5vw,54px)}
.sect-hero{padding-block:clamp(48px,8vw,104px) clamp(40px,6vw,72px)}
.measure{max-width:var(--measure)}
.measure-narrow{max-width:56ch}

/* Spacing utilities, for replacing the inline `style="margin-top:Npx"` attributes
   that had accumulated across the pages — 61 of them across 18 distinct values,
   so vertical rhythm drifted from section to section with no rule behind it.

   Six steps. The scale is 8 / 14 / 22 / 26 / 34 rather than a clean geometric
   ratio because 26px was by far the most common inline value in use and snapping
   all of those to 22 or 34 would have visibly moved layout that already reads
   correctly. All nine inline 26px margins now use .mt-ml; the smaller one-off
   values (3, 4, 6, 10, 11, 12, 15, 16, 18, 20, 24, 28, 30px) are still inline,
   so this migration is partial by design — collapsing every one of them onto a
   six-step scale would move layout that nobody has complained about. Prefer
   these classes for anything new. */
.mt-xs{margin-top:8px}
.mt-s{margin-top:14px}
.mt-m{margin-top:22px}
.mt-ml{margin-top:26px}
.mt-l{margin-top:34px}
.mb-xs{margin-bottom:8px}

/* ---------- type ---------- */
.display{
  font-size:var(--fs-display);
  line-height:.98;
  letter-spacing:-.033em;
  font-weight:600;
  text-wrap:balance;
}
.h1{font-size:var(--fs-h1);line-height:1.06;letter-spacing:-.026em;font-weight:600;text-wrap:balance}
.h2{font-size:var(--fs-h2);line-height:1.14;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.h3{font-size:var(--fs-h3);line-height:1.3;letter-spacing:-.012em;font-weight:600}
.lede{font-size:var(--fs-lede);line-height:1.55;color:var(--text-2);letter-spacing:-.008em}
.body{color:var(--text-2);line-height:1.68}
.body + .body{margin-top:1.05em}
.sm{font-size:var(--fs-sm);color:var(--muted);line-height:1.6}
.xs{font-size:var(--fs-xs);color:var(--muted)}
strong{color:var(--text);font-weight:600}
em{font-style:italic;color:var(--text)}

.mono{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--muted);font-weight:400}
.idx{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--faint)}
.idx b{color:var(--accent);font-weight:400}

.rule-accent{height:1px;background:var(--accent-line);border:0;width:40px;margin:0}

.pull{
  font-size:clamp(1.3rem,2.6vw,1.85rem);
  line-height:1.26;
  letter-spacing:-.022em;
  font-weight:500;
  color:var(--text);
  text-wrap:balance;
}

/* ---------- section header ---------- */
.sh{display:block}
.sh-label{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sh-label .mono{color:var(--accent)}
.sh-sub{margin-top:14px;color:var(--muted);font-size:var(--fs-sm);max-width:60ch}

/* ---------- buttons ---------- */
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:9px;
  padding:12px 20px;border-radius:var(--r);
  font-size:var(--fs-sm);font-weight:600;letter-spacing:-.005em;
  border:1px solid transparent;
  transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast),transform var(--t-fast);
  will-change:transform;
}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--accent);color:#0E1011;border-color:var(--accent)}
.btn-p:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
html[data-theme="light"] .btn-p{color:#fff}
.btn-s{border-color:var(--line-ctl);color:var(--text);background:transparent}
.btn-s:hover{border-color:var(--text);background:var(--surface)}
.btn-q{padding:10px 0;color:var(--muted);font-weight:500}
.btn-q:hover{color:var(--accent)}
.btn-q .ic{transition:transform var(--t-fast)}
.btn-q:hover .ic{transform:translateY(2px)}

.tlink{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--text);font-size:var(--fs-sm);font-weight:600;
  border-bottom:1px solid var(--accent-line);padding-bottom:2px;
  transition:border-color var(--t-fast),color var(--t-fast);
}
.tlink:hover{border-color:var(--accent);color:var(--accent)}
.tlink .ar{transition:transform var(--t-fast)}
.tlink:hover .ar{transform:translateX(3px)}

/* ---------- nav ---------- */
.topbar{
  position:sticky;top:0;z-index:90;
  background:color-mix(in srgb,var(--base) 88%,transparent);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line-soft);
}
@supports not (backdrop-filter:blur(2px)){.topbar{background:var(--base)}}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:var(--topbar-h)}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;padding:6px 0}
.brand-mark{width:22px;height:22px;flex-shrink:0}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-n{font-size:.9375rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.brand-r{font-family:var(--mono);font-size:.625rem;letter-spacing:.09em;color:var(--faint);margin-top:3px}
.brand:hover .brand-n{color:var(--accent)}
.brand-n,.brand-mark path,.brand-mark rect{transition:color var(--t-fast),fill var(--t-fast)}

.nav{display:flex;align-items:center;gap:2px}
.nav-a{
  position:relative;padding:8px 11px;border-radius:var(--r);
  font-size:.875rem;color:var(--muted);font-weight:500;letter-spacing:-.006em;
  transition:color var(--t-fast),background var(--t-fast);white-space:nowrap;
}
.nav-a:hover{color:var(--text);background:var(--surface)}
.nav-a[aria-current="page"]{color:var(--text)}
.nav-a[aria-current="page"]::after{
  content:"";position:absolute;left:11px;right:11px;bottom:1px;height:1px;background:var(--accent);
}
.nav-end{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-cta{padding:9px 16px;border:1px solid var(--line-ctl);border-radius:var(--r);font-size:.875rem;font-weight:600;transition:border-color var(--t-fast),background var(--t-fast)}
.nav-cta:hover{border-color:var(--accent);background:var(--accent-wash)}
.nav-cta[aria-current="page"]{border-color:var(--accent);color:var(--accent)}

.icbtn{
  width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);
  border:1px solid var(--line-ctl);color:var(--muted);
  transition:color var(--t-fast),border-color var(--t-fast),background var(--t-fast);
}
.icbtn:hover{color:var(--text);border-color:var(--text-2);background:var(--surface)}
.burger{display:none}

/* mobile sheet */
.sheet{
  position:fixed;inset:var(--topbar-h) 0 0;z-index:80;
  background:var(--base);
  display:flex;flex-direction:column;
  padding:8px var(--pad) calc(24px + env(safe-area-inset-bottom));
  overflow-y:auto;
  opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:opacity var(--t-mid),transform var(--t-mid),visibility var(--t-mid);
}
/* `display:flex` above outranks the UA's `[hidden]{display:none}` (a class beats
   an attribute selector on an unqualified element), so the hidden attribute the
   JS toggles was being ignored and only opacity/visibility were doing the work.
   Restate it at matching specificity. */
.sheet[hidden]{display:none}
.sheet.on{opacity:1;visibility:visible;transform:none}
.sheet-a{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:17px 2px;border-bottom:1px solid var(--line-soft);
  font-size:1.28rem;font-weight:600;letter-spacing:-.022em;color:var(--text-2);
}
.sheet-a[aria-current="page"]{color:var(--accent)}
.sheet-a .n{font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;color:var(--faint)}
.sheet-foot{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;gap:16px}

/* ---------- hero ---------- */
.hero-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.hero-h1{margin-bottom:26px}
.hero-h1 .ln{display:block;overflow:hidden}
.hero-h1 .ln > span{display:block}
.hero-lede{max-width:60ch;margin-bottom:32px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line-soft)}
.hero-meta div{display:flex;flex-direction:column;gap:4px}
.hero-meta dt{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--faint)}
.hero-meta dd{margin:0;font-size:var(--fs-sm);color:var(--text-2)}

/* signature: ambiguity -> impact axis */
.axis-wrap{margin-top:clamp(38px,5vw,64px);position:relative}
.axis-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:16px}
.axis-svg{width:100%;height:auto;overflow:visible}
.axis-node{cursor:default}
.axis-node .nd-hit{fill:transparent}
.axis-node .nd-ring{fill:none;stroke:var(--line-strong);stroke-width:1;transition:stroke var(--t-fast),r var(--t-fast)}
.axis-node .nd-core{fill:var(--muted);transition:fill var(--t-fast),r var(--t-fast)}
.axis-node .nd-lab{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:-.01em;fill:var(--text-2);transition:fill var(--t-fast)}
.axis-node .nd-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.045em;fill:var(--faint);opacity:0;transition:opacity var(--t-fast)}
.axis-node:hover .nd-ring,.axis-node:focus-visible .nd-ring{stroke:var(--accent)}
.axis-node:hover .nd-core,.axis-node:focus-visible .nd-core{fill:var(--accent)}
.axis-node:hover .nd-lab,.axis-node:focus-visible .nd-lab{fill:var(--text)}
.axis-node:hover .nd-sub,.axis-node:focus-visible .nd-sub{opacity:1}
.axis-edge{stroke:var(--line-strong);stroke-width:1;transition:stroke var(--t-fast)}
.axis-edge.lit{stroke:var(--accent-line)}
.axis-spark{fill:var(--faint)}
.axis-base{stroke:var(--line);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round}

/* mobile recomposition: the chain becomes a vertical list, not a shrunk SVG */
.axis-v{display:none}
.axis-v-i{position:relative;display:flex;flex-direction:column;gap:3px;padding:14px 0 14px 22px;border-bottom:1px solid var(--line-soft)}
.axis-v-i:last-child{border-bottom:0}
.axis-v-i::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--line)}
.axis-v-i:first-child::before{top:50%}
.axis-v-i:last-child::before{bottom:50%}
.axis-v-i::after{content:"";position:absolute;left:0;top:calc(50% - 4px);width:7px;height:7px;border-radius:50%;background:var(--base);border:1px solid var(--line-strong)}
.axis-v-i:last-child::after{background:var(--accent);border-color:var(--accent)}
.axis-v-k{font-size:1rem;font-weight:600;letter-spacing:-.016em}
.axis-v-d{font-family:var(--mono);font-size:.6875rem;letter-spacing:.045em;color:var(--faint)}

/* ---------- panels & cards ---------- */
.panel{border:1px solid var(--line-soft);border-radius:var(--r-lg);background:var(--surface);padding:clamp(20px,2.4vw,30px)}
.panel-flat{border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:clamp(20px,2.4vw,30px)}

/* what-i-do: a bordered matrix, not a deck of identical cards */
.mx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.mx-i{padding:clamp(20px,2.2vw,28px);border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);position:relative;transition:background var(--t-fast)}
.mx-i:nth-child(3n){border-right:0}
.mx-i:nth-last-child(-n+3){border-bottom:0}
.mx-i:hover{background:var(--surface)}
.mx-i:hover .mx-n{color:var(--accent)}
.mx-n{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--faint);transition:color var(--t-fast)}
.mx-h{margin:14px 0 9px}
.mx-p{font-size:var(--fs-sm);color:var(--muted);line-height:1.62}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.met{padding:26px 20px 24px;border-right:1px solid var(--line-soft)}
.met:last-child{border-right:0}
.met-v{font-family:var(--mono);font-size:clamp(1.6rem,3.3vw,2.35rem);font-weight:500;letter-spacing:-.03em;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}
.met-v .u{color:var(--accent)}
.met-l{margin-top:11px;font-size:var(--fs-xs);color:var(--muted);line-height:1.45}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border:1px solid var(--line-soft);border-radius:100px;
  font-size:var(--fs-xs);color:var(--text-2);background:var(--base);
  transition:border-color var(--t-fast),color var(--t-fast);
}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip-m{font-family:var(--mono);font-size:.6875rem;letter-spacing:.04em}
.chip-a{border-color:var(--accent-line);color:var(--accent);background:var(--accent-wash)}
/* 11px type, so it needs the full 4.5:1. Light --accent over the wash was
   4.48:1 on base and 4.20:1 on surface; --accent-hi is 6.04 / 5.66. */
html[data-theme="light"] .chip-a{color:var(--accent-hi)}
.chip-ff{border-color:rgba(124,92,255,.35);color:var(--ff-hi);background:var(--ff-wash)}
html[data-theme="light"] .chip-ff{color:var(--ff-hi)}

/* status note — honesty markers */
.note{
  display:flex;gap:11px;align-items:flex-start;
  border-left:2px solid var(--accent-line);padding:2px 0 2px 14px;
  font-size:var(--fs-sm);color:var(--muted);line-height:1.6;
}
/* This was --fs-xs (13px), and the inner <p class="body"> inherited it. That put
   CONCURRENCY — the three-concurrent-roles paragraph, which is the most credible
   thing on the Experience page because it names its own cost — and TERSE_NOTE in
   the smallest type on the page, behind an accent bar that reads "footnote".
   14px now. The bar and the muted colour already signal "aside"; the size was
   doing the same job a third time, at the cost of legibility. */
.note-k{flex:none;min-width:94px;padding-top:3px;color:var(--faint)}
.tl + .note{margin-top:clamp(26px,3vw,38px)}
@media (max-width:560px){
  .note{flex-direction:column;gap:7px}
  .note-k{min-width:0;padding-top:0}
}

/* ---------- timeline ---------- */
.tl{position:relative}
.tl-i{position:relative;padding:0 0 0 30px;border-left:1px solid var(--line);padding-bottom:clamp(34px,4vw,50px)}
.tl-i:last-child{padding-bottom:0;border-left-color:transparent}
.tl-i::before{
  content:"";position:absolute;left:-4.5px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--base);border:1px solid var(--line-strong);transition:border-color var(--t-fast),background var(--t-fast);
}
.tl-i.cur::before{border-color:var(--accent);background:var(--accent)}
.tl-i:last-child::after{content:"";position:absolute;left:0;top:7px;bottom:auto;height:calc(100% - 7px);width:1px;background:linear-gradient(var(--line),transparent)}
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:4px}
.tl-org{font-size:1.32rem;font-weight:600;letter-spacing:-.024em}
.tl-when{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--muted);padding:3px 8px;border:1px solid var(--line-soft);border-radius:100px}
.tl-role{color:var(--accent);font-size:var(--fs-sm);font-weight:600;margin-bottom:12px}
/* Additional titles held in the same engagement. Deliberately NOT accent and NOT
   600 weight: the accent colour is what marks "this is the job title", so a
   second title in the same treatment would read as one long invented title.
   Dropping to --text-2 at 400 makes the "also" read as what it is — a second hat
   in the same role, not a promotion. */
.tl-also{display:block;margin-top:3px;color:var(--text-2);font-weight:400;letter-spacing:0}
.tl-body{max-width:64ch}
.tl-toggle{
  margin-top:15px;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--muted);
  padding:7px 12px;border:1px solid var(--line-ctl);border-radius:100px;
  transition:color var(--t-fast),border-color var(--t-fast);
}
.tl-toggle:hover{color:var(--text);border-color:var(--text-2)}
.tl-toggle .cv{transition:transform var(--t-mid)}
.tl-toggle[aria-expanded="true"] .cv{transform:rotate(180deg)}
.tl-drawer{overflow:hidden;height:0;transition:height var(--t-mid)}
.tl-drawer-in{padding-top:18px}
.tl-tags{margin-top:16px}
.tl-meta{
  display:inline-block;margin-left:11px;padding-left:11px;border-left:1px solid var(--line);
  font-family:var(--mono);font-size:var(--fs-label);font-weight:400;letter-spacing:.04em;color:var(--muted)
}
@media (max-width:560px){
  .tl-meta{display:block;margin:5px 0 0;padding:0;border-left:0}
}
/* Freelance / contract client list */
.cl{
  list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:4px;overflow:hidden
}
.cl-i{background:var(--base);padding:15px 17px;display:flex;flex-direction:column;gap:5px}
.cl-org{font-size:var(--fs-sm);font-weight:600;letter-spacing:-.014em}
.cl-note{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.03em;color:var(--muted);line-height:1.45}
/* Credentials */
.cg + .cg{margin-top:clamp(26px,3vw,36px)}
.cg-k{
  display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:var(--fs-label);
  font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:12px
}
.cg-l{list-style:none;border-top:1px solid var(--line-soft)}
.cg-i{border-bottom:1px solid var(--line-soft)}
.cg-a{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:4px 18px;padding:14px 2px;transition:background var(--t-fast),padding-left var(--t-fast)
}
.cg-a:hover,.cg-a:focus-visible{background:var(--surface);padding-left:10px}
.cg-name{font-size:var(--fs-sm);font-weight:500;letter-spacing:-.012em;color:var(--text)}
.cg-meta{
  grid-column:1;font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.04em;color:var(--faint)
}
.cg-v{
  grid-column:2;grid-row:1 / span 2;display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.05em;color:var(--muted);
  opacity:0;transition:opacity var(--t-fast),color var(--t-fast);white-space:nowrap
}
.cg-a:hover .cg-v,.cg-a:focus-visible .cg-v{opacity:1;color:var(--accent)}
/* Keyboard and touch users never hover — keep the affordance visible for them */
@media (hover:none){ .cg-v{opacity:.7} }

/* ---------- projects ---------- */
.pj-hero{border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.pj-hero-top{padding:clamp(22px,3vw,34px);border-bottom:1px solid var(--line-soft);position:relative}
.pj-hero-top::after{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:linear-gradient(var(--ff),transparent)}
.pj-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft)}
.pj-cell{background:var(--surface);padding:clamp(20px,2.4vw,28px)}

.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pcard{
  display:block;position:relative;
  border:1px solid var(--line-ctl);border-radius:var(--r-lg);
  padding:clamp(20px,2.4vw,28px);background:var(--base);
  transition:border-color var(--t-fast),background var(--t-fast),transform var(--t-fast);
  overflow:hidden;
}
.pcard::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--accent);transform:scaleY(0);transform-origin:top;
  transition:transform var(--t-mid);
}
.pcard:hover{border-color:var(--text-2);background:var(--surface);transform:translateY(-2px)}
.pcard:hover::before{transform:scaleY(1)}
.pcard-ff::before{background:var(--ff)}
.pcard-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.pcard-h{margin:12px 0 8px}
.pcard-more{margin-top:16px;display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);color:var(--muted);font-weight:600;transition:color var(--t-fast)}
.pcard:hover .pcard-more{color:var(--accent)}
.pcard-ff:hover .pcard-more{color:var(--ff-hi)}
.pcard-more .ar{transition:transform var(--t-fast)}
.pcard:hover .pcard-more .ar{transform:translateX(3px)}
.pcard-reveal{max-height:0;opacity:0;overflow:hidden;transition:max-height var(--t-mid),opacity var(--t-mid),margin var(--t-mid)}
.pcard:hover .pcard-reveal,.pcard:focus-visible .pcard-reveal{max-height:140px;opacity:1;margin-top:14px}

/* architecture diagram */
.arch{border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.arch-row{display:grid;grid-template-columns:118px minmax(0,1fr);border-bottom:1px solid var(--line-soft)}
.arch-row:last-child{border-bottom:0}
.arch-k{
  padding:16px 14px;border-right:1px solid var(--line-soft);background:var(--surface);
  font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.05em;color:var(--muted);line-height:1.4;
}
.arch-v{padding:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.arch-b{
  padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);
  font-size:var(--fs-xs);color:var(--text-2);background:var(--base);
  transition:border-color var(--t-fast),color var(--t-fast);
}
.arch-b:hover{border-color:var(--ff);color:var(--text)}
.arch-flow{font-family:var(--mono);color:var(--faint);font-size:.75rem;padding-inline:2px}

/* surface map */
.smap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.smap-i{background:var(--base);padding:16px 15px;transition:background var(--t-fast)}
.smap-i:hover{background:var(--surface)}
.smap-n{font-family:var(--mono);font-size:1.05rem;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.smap-l{font-size:var(--fs-xs);color:var(--text-2);margin-top:6px;font-weight:500}

/* ---------- process (product thinking) ---------- */
.proc{border-top:1px solid var(--line)}
.proc-i{display:grid;grid-template-columns:88px minmax(0,1fr);gap:var(--gutter);padding-block:clamp(24px,3vw,36px);border-bottom:1px solid var(--line-soft);transition:background var(--t-fast)}
.proc-i:hover{background:var(--surface)}
.proc-n{font-family:var(--mono);font-size:1.6rem;font-weight:400;color:var(--faint);letter-spacing:-.02em;line-height:1;transition:color var(--t-fast);font-variant-numeric:tabular-nums}
.proc-i:hover .proc-n{color:var(--accent)}
.proc-h{margin-bottom:10px}
.proc-tools{margin-top:14px}

/* ---------- skills ---------- */
.sk-g{padding-block:clamp(24px,3vw,34px);border-bottom:1px solid var(--line-soft)}
.sk-g:last-child{border-bottom:0}
.sk-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sk-head .h3{margin-right:auto}
.sk-count{font-family:var(--mono);font-size:var(--fs-label);color:var(--faint);letter-spacing:.06em}

/* ---------- resume ---------- */
.cv-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:22px;align-items:flex-start}
.cv-sect{padding-block:clamp(22px,2.6vw,32px);border-top:1px solid var(--line-soft)}
.cv-sect:first-of-type{border-top:0}
.cv-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--gutter)}
.cv-when{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--muted);padding-top:5px}
.cv-li{position:relative;padding-left:17px;color:var(--text-2);font-size:var(--fs-sm);line-height:1.62;margin-top:8px}
.cv-li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--accent)}
.cv-item + .cv-item{margin-top:26px}

/* ---------- contact ---------- */
.ct-list{border-top:1px solid var(--line)}
.ct-i{
  /* flex-start, not space-between. space-between was aligning these rows by
     child count rather than by content: three children (label, value, arrow)
     spread across the row, two children (label, value) threw the value to the
     far right. Same list, two alignments, for a reason no reader could see. */
  display:flex;align-items:center;gap:18px;justify-content:flex-start;
  padding:20px 4px;border-bottom:1px solid var(--line-soft);
  transition:padding-left var(--t-fast),background var(--t-fast);
}
a.ct-i:hover{padding-left:12px;background:var(--surface)}
.ct-k{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--faint);width:92px;flex-shrink:0}
.ct-v{font-size:clamp(.98rem,1.7vw,1.14rem);font-weight:500;letter-spacing:-.014em;color:var(--text);word-break:break-word}
/* The qualifier inside a value — "· open to global relocation". Same line, lower
   emphasis, so the fact and its caveat do not compete for the same weight. */
.ct-n{color:var(--muted);font-weight:400;font-size:var(--fs-sm);letter-spacing:0}
a.ct-i:hover .ct-v{color:var(--accent)}
.ct-x{margin-left:auto;color:var(--faint);flex-shrink:0;display:inline-flex;transition:color var(--t-fast),transform var(--t-fast)}
a.ct-i:hover .ct-x{color:var(--accent);transform:translate(2px,-2px)}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);margin-top:clamp(40px,6vw,80px);background:var(--base)}
.foot-cta{padding-block:clamp(44px,6vw,76px);border-bottom:1px solid var(--line-soft)}
.foot-main{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:38px;padding-block:clamp(34px,4.5vw,52px)}
.foot-h{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--faint);margin-bottom:15px}
.foot-nav{display:flex;flex-direction:column;gap:11px}
.foot-nav a{font-size:var(--fs-sm);color:var(--muted);transition:color var(--t-fast),transform var(--t-fast);width:fit-content}
.foot-nav a:hover{color:var(--text)}
.foot-bot{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding-block:22px;border-top:1px solid var(--line-soft)}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.soc{
  display:inline-flex;align-items:center;gap:8px;padding:9px 13px;
  border:1px solid var(--line-ctl);border-radius:100px;
  font-size:var(--fs-xs);color:var(--text-2);font-weight:500;
  transition:border-color var(--t-fast),color var(--t-fast),background var(--t-fast);
}
.soc:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-wash)}
.soc svg{flex-shrink:0}

/* ---------- motion ---------- */
/* Sticky footer. Contact and Product Thinking are short enough that on a tall
   monitor the footer would otherwise stop mid-screen with empty background
   below it. min-height is set in vh first, then dvh, so older Safari still
   gets the behaviour. */
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#app > main{flex:1 0 auto}
.page{animation:pgIn 240ms cubic-bezier(.22,1,.36,1) both}
@keyframes pgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
[data-reveal]{opacity:0;transform:translateY(12px);transition:opacity 520ms cubic-bezier(.22,1,.36,1),transform 520ms cubic-bezier(.22,1,.36,1)}
[data-reveal].in{opacity:1;transform:none}
.hero-h1 .ln > span{animation:rise 680ms cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{transform:translateY(102%)}to{transform:none}}

html.no-motion .page,html.no-motion [data-reveal],html.no-motion .hero-h1 .ln > span{animation:none!important;opacity:1!important;transform:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}
  [data-reveal]{opacity:1!important;transform:none!important}
  .hero-h1 .ln > span{transform:none!important}
}

/* ============================================================
   RESPONSIVE — sections are recomposed, not shrunk
   ============================================================ */
@media (max-width:1120px){
  :root{--rail:120px}
  .nav-a{padding:8px 8px;font-size:.845rem}
}
@media (max-width:980px){
  .burger{display:grid}
  .nav,.nav-cta{display:none}
  :root{--rail:0px;--gutter:0px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .col{border-left:0;padding-left:0}
  .rail{margin-bottom:16px}
  .rail-sticky{position:static}
  .rail-hide{display:none}
  .mx{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mx-i:nth-child(3n){border-right:1px solid var(--line-soft)}
  .mx-i:nth-child(2n){border-right:0}

const SkillGroup = g => `

/* -- ArchRows -------------------------------------------------------------- */
/* Keyed rows — the calm alternative to a wall of chips. Reach for this whenever a
   list is long enough that the reader would skim it: the key tells them which
   part of the list they care about, so they stop reading the whole thing. Used
   for the toolkit, the tool inventory, and the analytics question set. */
const ArchRows = groups => `
  <div class="arch">
    ${groups.map(g=>`
      <div class="arch-row">
        <div class="arch-k">${g.g}</div>
        <div class="arch-v">${g.items.map(i=>`<span class="arch-b">${i}</span>`).join('')}</div>
      </div>`).join('')}
  </div>`;

/* -- ExperienceTimeline (items expand only when there is detail to reveal) --- */
const ExperienceTimeline = (items=EXPERIENCE) => `
  <div class="tl">
    ${items.map((e,i)=>{
      const hasDetail = Array.isArray(e.detail) && e.detail.length > 0;
      const meta = [e.engagement, e.mode].filter(Boolean).join(' · ');
      const chips = `<ul class="chips">${e.focus.map(f=>`<li class="chip chip-m">${f}</li>`).join('')}</ul>`;
      return `
      <article class="tl-i${e.current?' cur':''}" data-reveal>
        <div class="tl-top">
          <h3 class="tl-org">${e.org}</h3>
          ${e.when
            ? `<span class="tl-when">${e.when}</span>`
            : `<span class="tl-when" title="No dates supplied for this engagement">dates not listed</span>`}
        </div>
        ${/* Order matters here and is not cosmetic: .tl-also is display:block, so
             whatever follows it starts a new line. .tl-meta's border-left and
             11px margin are a separator designed to sit INLINE after the role —
             rendered after the block it landed on its own line as a stray tick
             with nothing to separate. Meta first, `also` last. */''}
        <p class="tl-role">${e.role}${meta?`<span class="tl-meta">${meta}</span>`:''}${e.also?`<span class="tl-also">also ${e.also}</span>`:''}</p>
        <div class="tl-body"><p class="body">${e.summary}</p></div>
        ${hasDetail ? `
        <button class="tl-toggle" type="button" aria-expanded="false" aria-controls="tld-${i}">
          <span class="tl-toggle-t">More detail</span>${ICON.cv()}
        </button>
        <div class="tl-drawer" id="tld-${i}" role="region" aria-label="${e.org} detail">
          <div class="tl-drawer-in">
            ${e.detail.map(d=>`<p class="body measure">${d}</p>`).join('')}
            <div class="tl-tags">${chips}</div>
          </div>
        </div>`
        : `<div class="tl-tags">${chips}</div>`}
      </article>`;
    }).join('')}
  </div>`;

/* --- the signature element: ambiguity resolving into an ordered system ---- */
const AXIS_NODES = [
  { k:'Business',   d:'model · market · trade-offs',  x:78,  y:132 },
  { k:'Product',    d:'problem · scope · experience', x:264, y:118 },
  { k:'Technology', d:'systems · APIs · constraints', x:450, y:100 },
  { k:'Data',       d:'instrumentation · evidence',   x:636, y:80  },
  { k:'Growth',     d:'adoption · retention · loops', x:822, y:56  }
];

const Axis = () => {
  const n = AXIS_NODES;
  const edges = n.slice(0,-1).map((a,i)=>{
    const b = n[i+1];
    return `<line class="axis-edge" data-e="${i}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  }).join('');
  const sparks = Array.from({length:26},(_,i)=>{
    const sx = 30 + (i*37)%160, sy = 26 + (i*53)%150;
    return `<circle class="axis-spark" data-s="${i}" cx="${sx}" cy="${sy}" r="1.5" opacity=".5"/>`;
  }).join('');
  const nodes = n.map((d,i)=>`
    <g class="axis-node" data-n="${i}" tabindex="0" role="img" aria-label="${d.k}: ${d.d.replace(/ · /g,', ')}">
      <circle class="nd-hit" cx="${d.x}" cy="${d.y}" r="26"/>
      <circle class="nd-ring" cx="${d.x}" cy="${d.y}" r="9"/>
      <circle class="nd-core" cx="${d.x}" cy="${d.y}" r="3.2"/>
      <text class="nd-lab" x="${d.x}" y="${d.y+28}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${d.k}</text>
      <text class="nd-sub" x="${d.x}" y="${d.y+42}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${d.d}</text>
    </g>`).join('');

  return `
  <div class="axis-wrap" data-axis>
    <div class="axis-head">
      <span class="mono">ambiguity</span>
      <span class="mono" style="color:var(--accent)">impact</span>
    </div>
    <div class="axis-h">
      <svg class="axis-svg" viewBox="0 0 900 190" preserveAspectRatio="xMidYMid meet" role="group" aria-labelledby="axis-t">
        <title id="axis-t">The five domains I work across, from business through to growth</title>
        <line class="axis-base" x1="20" y1="178" x2="880" y2="178"/>
        <g data-sparks>${sparks}</g>
        ${edges}${nodes}
      </svg>
    </div>
    <ol class="axis-v">
      ${n.map(d=>`<li class="axis-v-i"><span class="axis-v-k">${d.k}</span><span class="axis-v-d">${d.d}</span></li>`).join('')}
    </ol>
    <p class="sm" style="margin-top:18px;max-width:56ch">Product decisions rarely sit inside one of these. Most of my work is the translation between them.</p>
  </div>`;
};

/* ======================  4. ROUTER  ===================================== */

const ROUTES = { '/':Home, '/about':About, '/experience':Experience, '/projects':Projects,
                 '/thinking':Thinking, '/skills':Skills, '/resume':Resume, '/contact':Contact };

const app = document.getElementById('app');
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function currentPath(){
  const raw = (location.hash || '#/').replace(/^#/,'');
  const path = raw.split('?')[0].replace(/\/$/,'') || '/';
  return ROUTES[path] ? path : '/';
}

function setMeta(path){
  const meta = NAV.find(n => n.path === path) || NAV[0];
  document.title = meta.title;
}

function render(){
  const path = currentPath();
  setMeta(path);
  app.innerHTML = `
    ${Navbar(path)}
    <main id="main" class="page" tabindex="-1">${ROUTES[path]()}</main>
    ${Footer(path)}`;
  bind(path);
}

/* ======================  5. BEHAVIOUR  ================================== */

function bind(path){
  /* --- theme ------------------------------------------------------------ */
  const root = document.documentElement;
  const tbtn = document.getElementById('theme');
  const paint = () => {
    const light = root.dataset.theme === 'light';
    tbtn.innerHTML = light ? ICON.moon() : ICON.sun();
    tbtn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', light ? '#FAFAF8' : '#0E1011');
  };
  paint();
  tbtn.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', root.dataset.theme); } catch(e){}
    paint();
  });

  /* --- mobile sheet ----------------------------------------------------- */
  const burger = document.getElementById('burger');
  const sheet  = document.getElementById('sheet');
  const setSheet = open => {
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    burger.innerHTML = open ? ICON.close() : ICON.burger();
    if (open) {
      sheet.hidden = false;
      /* Two frames, not one. Now that .sheet[hidden] really does set display:none,
         the element has no computed layout in the frame where it is unhidden, and
         a single rAF is not reliably enough for the browser to have a "from"
         state to transition out of — the sheet would sometimes snap in with no
         animation. The second frame guarantees one. */
      requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('on')));
    } else {
      sheet.classList.remove('on');
      setTimeout(()=>{ sheet.hidden = true; }, 200);
    }
    document.body.style.overflow = open ? 'hidden' : '';
  };
  burger.addEventListener('click', () => setSheet(burger.getAttribute('aria-expanded') !== 'true'));
  sheet.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setSheet(false)));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && burger.getAttribute('aria-expanded') === 'true') { setSheet(false); burger.focus(); }
  });
  /* Crossing to desktop width hides the burger via media query, which would strand
     an open sheet and — worse — leave body{overflow:hidden} with no visible way to
     undo it. Close on the way past the breakpoint. */
  const wide = window.matchMedia('(min-width:981px)');
  const onWide = e => { if (e.matches && burger.getAttribute('aria-expanded') === 'true') setSheet(false); };
  wide.addEventListener ? wide.addEventListener('change', onWide) : wide.addListener(onWide);

  /* --- reveal on scroll (only where it earns its place) ------------------ */
  const revealables = document.querySelectorAll('[data-reveal]');
  if (reduced() || !('IntersectionObserver' in window)) {
    revealables.forEach(el => el.classList.add('in'));
  } else {
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.classList.add('in');
        if (en.target.classList.contains('metrics')) countUp(en.target);
        obs.unobserve(en.target);
      });
    }, { rootMargin:'0px 0px -12% 0px', threshold:0.15 });
    revealables.forEach(el => io.observe(el));
  }

  /* --- metrics count up ------------------------------------------------- */
  function countUp(scope){
    scope.querySelectorAll('[data-count]').forEach(el => {
      const target = parseFloat(el.dataset.count);
      const num = el.querySelector('.num');
      if (!num || reduced()) return;
      const dur = 900, t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        num.textContent = Math.round(target * eased);
        if (p < 1) requestAnimationFrame(step);
        else num.textContent = target;
      };
      num.textContent = '0';
      requestAnimationFrame(step);
    });
  }

  /* --- experience timeline drawers -------------------------------------- */
  document.querySelectorAll('.tl-toggle').forEach(btn => {
    const drawer = document.getElementById(btn.getAttribute('aria-controls'));
    const label = btn.querySelector('.tl-toggle-t');
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      label.textContent = open ? 'More detail' : 'Less detail';
      /* height:auto cannot be transitioned, so pin the pixel height first */
      drawer.style.height = drawer.scrollHeight + 'px';
      if (open) {
        requestAnimationFrame(() => { drawer.style.height = '0px'; });
      } else {
        drawer.addEventListener('transitionend', function done(ev){
          if (ev.propertyName !== 'height') return;
          drawer.style.height = 'auto';
          drawer.removeEventListener('transitionend', done);
        });
      }
    });
  });

  /* --- hero axis: one orchestrated resolve, then it stays still ---------- */
  const axis = document.querySelector('[data-axis]');
  if (axis) {
    const nodes  = axis.querySelectorAll('.axis-node');
    const edges  = axis.querySelectorAll('.axis-edge');
    const sparks = axis.querySelectorAll('.axis-spark');

    /* hovering a node lights the edges it participates in */
    nodes.forEach(g => {
      const i = +g.dataset.n;
      const lit = on => edges.forEach(e => {
        const k = +e.dataset.e;
        if (k === i || k === i - 1) e.classList.toggle('lit', on);
      });
      ['mouseenter','focus'].forEach(ev => g.addEventListener(ev, () => lit(true)));
      ['mouseleave','blur'].forEach(ev => g.addEventListener(ev, () => lit(false)));
    });

    if (reduced()) {
      sparks.forEach(s => s.setAttribute('opacity','0'));
    } else {
      /* scatter -> settle */
      const seed = i => ({ dx:((i*79)%120) - 78, dy:((i*47)%70) - 34 });
      nodes.forEach((g,i) => { const s = seed(i+3); g.style.opacity = '0'; g.setAttribute('transform',`translate(${s.dx} ${s.dy})`); });
      edges.forEach(e => {
        const len = e.getTotalLength ? e.getTotalLength() : 200;
        e.style.strokeDasharray = len; e.style.strokeDashoffset = len;
      });
      const dur = 1250, t0 = performance.now();
      const ease = p => 1 - Math.pow(1 - p, 3);
      const run = now => {
        const p = Math.min(1, (now - t0) / dur), e = ease(p);
        nodes.forEach((g,i) => {
          const s = seed(i+3);
          g.setAttribute('transform', `translate(${s.dx*(1-e)} ${s.dy*(1-e)})`);
          g.style.opacity = String(Math.min(1, Math.max(0, (p - i*0.06) * 2.6)));
        });
        edges.forEach(el => {
          const len = el.getTotalLength ? el.getTotalLength() : 200;
          el.style.strokeDashoffset = String(len * (1 - Math.max(0, (e - 0.25) / 0.75)));
        });
        sparks.forEach((s,i) => s.setAttribute('opacity', String(Math.max(0, 0.5 - e * (0.5 + (i%5)*0.06)))));
        if (p < 1) requestAnimationFrame(run);
        else { nodes.forEach(g=>{ g.removeAttribute('transform'); g.style.opacity='1'; });
               edges.forEach(el=>{ el.style.strokeDasharray='none'; el.style.strokeDashoffset='0'; }); }
      };
      requestAnimationFrame(run);
    }
  }

  /* --- print résumé ----------------------------------------------------- */
  const pc = document.getElementById('printcv');
  if (pc) pc.addEventListener('click', () => window.print());
}

/* ======================  6. BOOT  ======================================= */

try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
if (reduced()) document.documentElement.classList.add('no-motion');

let lastPath = null;
window.addEventListener('hashchange', () => {
  const p = currentPath();
  if (p === lastPath) return;
  lastPath = p;
  render();
  window.scrollTo({ top:0, behavior: reduced() ? 'auto' : 'smooth' });
  const m = document.getElementById('main');
  if (m) m.focus({ preventScroll:true });
});
lastPath = currentPath();
if (!location.hash) history.replaceState(null, '', '#/');
render();





</script>
