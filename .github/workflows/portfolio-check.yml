name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Render pages and validate résumé and assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run portfolio validator
        run: node tools/check.js
      - name: Set up Python for PDF validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned PDF dependencies
        run: python -m pip install "reportlab==5.1.0" "pypdf==6.21.4"
      - name: Generate a clean Product Manager PDF
        run: python tools/build-pm-resume.py /tmp/product-manager-generated.pdf
      - name: Validate generated Product Manager PDF
        run: python tools/check-pm-resume.py --generated-only /tmp/product-manager-generated.pdf
      - name: Generate a clean Community Management PDF
        run: python tools/build-community-resume.py /tmp/community-management-generated.pdf
      - name: Validate generated Community Management PDF
        run: python tools/check-community-resume.py --generated-only /tmp/community-management-generated.pdf
      - name: Archive validated résumé previews
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-resume-preview-pdfs
          path: |
            /tmp/product-manager-generated.pdf
            /tmp/community-management-generated.pdf
          if-no-files-found: error
          retention-days: 5
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  publish-community-pdf:
    name: Publish both résumé PDFs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python for PDF generation
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned PDF dependencies
        run: python -m pip install "reportlab==5.1.0" "pypdf==6.21.4"
      - name: Generate and validate both résumé PDFs
        run: |
          python tools/build-pm-resume.py /tmp/product-manager-generated.pdf
          python tools/check-pm-resume.py --generated-only /tmp/product-manager-generated.pdf
          python tools/build-community-resume.py /tmp/community-management-generated.pdf
          python tools/check-community-resume.py --generated-only /tmp/community-management-generated.pdf
      - name: Publish both generated PDFs when changed
        run: |
          cp /tmp/product-manager-generated.pdf Olamide-Olanipekun-Product-Manager.pdf
          cp /tmp/community-management-generated.pdf Olamide_Olanipekun_Community_Management_Resume.pdf
          if git diff --quiet -- Olamide-Olanipekun-Product-Manager.pdf Olamide_Olanipekun_Community_Management_Resume.pdf; then
            echo "Both résumé PDFs are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Olamide-Olanipekun-Product-Manager.pdf Olamide_Olanipekun_Community_Management_Resume.pdf
            git commit -m "Regenerate both résumé PDFs"
            git push origin HEAD:main
          fi
      - name: Validate committed and generated résumé PDFs
        run: |
          python tools/check-pm-resume.py /tmp/product-manager-generated.pdf
          python tools/check-community-resume.py /tmp/community-management-generated.pdf
