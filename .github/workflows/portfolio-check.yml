name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Render pages and validate résumé and assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run portfolio validator
        run: node tools/check.js
      - name: Set up Python for PDF validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install reportlab pypdf
      - name: Generate current PM résumé
        run: python tools/build-pm-resume.py /tmp/product-manager-generated.pdf
      - name: Validate committed and generated PM PDFs
        run: python tools/check-pm-resume.py /tmp/product-manager-generated.pdf
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
